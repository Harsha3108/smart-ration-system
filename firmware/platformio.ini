; PlatformIO Project Configuration File for ESP32 Smart Ration System
; Run via scripts/upload_and_monitor.bat or `pio run -t upload -t monitor`

[platformio]
src_dir = SmartRationSystem

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^6.21.4
    ; Note: HX711, LiquidCrystal_I2C, and Adafruit_Fingerprint are bundled in SmartRationSystem/
